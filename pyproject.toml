[project]
name = "agentjambench-veris-agent"
version = "0.1.0"
description = "FastAPI stub for Veris sandbox (separate from Django benchmark UI)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true
